on:
  pull_request:
    branches:
      - main

jobs:
  wilco:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Pr checks

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: postgres
          SECRET_KEY: secret
          POSTGRES_DB: anythink-market
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out project
        uses: actions/checkout@v2

      - name: Use Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9.13"

      - uses: oNaiPs/secrets-to-env-action@v1
        with:
          secrets: ${{ toJSON(secrets) }}

      - name: Setup Node for Wilco Checks
        uses: actions/setup-node@v3
        with:
          node-version: "16"

      - name: Run integration checks (docker compose + script)
        run: |
          set -euo pipefail
          # build and start services
          docker compose up --detach --build
          # retry the endpoint checks for up to ~60s
          for i in {1..12}; do
            if ./scripts/check_endpoints.sh; then
              echo "Integration checks passed"
              break
            else
              echo "Attempt $i failed, retrying..."
              sleep 5
            fi
          done
          # show logs (helpful in CI if something goes wrong)
          docker compose logs --tail=200
        shell: bash
      - name: Tear down compose
        if: always()
        run: |
          docker compose down --volumes --remove-orphans || true
        shell: bash
